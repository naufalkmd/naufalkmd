name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate 3D contribution graph assets
        uses: naufalkmd/github-profile-3d-contrib@custom-transparent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Update followers badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api "users/${{ github.repository_owner }}" --jq .followers)
          sed -i -E "s|badge/Followers-[0-9]+-|badge/Followers-${count}-|" README.md

      - name: Update Kaggle, Hugging Face and Devpost stats
        run: |
          pip install --quiet kagglesdk
          python scripts/platform_stats.py ${{ github.repository_owner }} README.md

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git pull --rebase origin main
            git push
          fi
